# Second run, sized from the 4,600-question test run (the pilot).
# The pilot could not certify 10% risk: its 427 cal_gate units gave a tightest
# bound of 15.9%. This run uses all unique MedQA training questions and gives
# cal_gate 30% of groups. Discovery CV in the pilot picked C = 0.01, the edge
# of the grid, so the grid now extends down to 0.0001. The target is unchanged.
# Steering at dose 1 barely moved P(E); dose 1 is about 15% of the residual norm,
# so this run adds exploratory doses up to 4.
run_id = "health-llama31-8b-full-run"
seed = 17
output_root = "../runs"

[data]
real_repo = "GBaker/MedQA-USMLE-4-options"
real_revision = "0fb93dd23a7339b6dcd27e241cb9b5eca62d4d18"
real_file = "phrases_no_exclude_train.jsonl"
n_real = 10000
n_fictional_entities = 500

[data.proportions]
discovery = 0.4
cal_prob = 0.1
cal_gate = 0.3
test = 0.2

[model]
name = "meta-llama/Llama-3.1-8B-Instruct"
revision = "0e9e39f249a16976918f6564b8830bc894c89659"
dtype = "bfloat16"
batch_size = 16

[probe]
c_grid = [0.0001, 0.001, 0.01, 0.1, 1.0, 10.0]
sweep_c = 0.01
cv_folds = 5

[gate]
target_risk = 0.10
delta = 0.05

[steering]
doses = [-4.0, -2.0, -1.0, 0.0, 1.0, 2.0, 4.0]
n_items = 200
n_random = 3
identity_tolerance = 1e-4
